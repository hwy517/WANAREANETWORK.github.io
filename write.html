<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <style>
    /* ===== Write 페이지 전용 ===== */
    body.page-write {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .write-main {
      flex: 1 0 auto;
      padding: 0 2rem 4rem;
    }

    /* 글: 화면의 절반 폭 (A4 느낌) */
    .write-text {
      width: 50vw;
      max-width: 50vw;
      font-size: 0.88rem;
      line-height: 1.9;
      white-space: pre-line;      /* 입력한 줄바꿈 그대로 */
      word-break: keep-all;       /* 한글 단어 중간에서 안 끊기게 */
    }

    /* ===== PRESS 버튼 =====
       --w / --h : 버튼 지름 (크기를 바꾸려면 여기 숫자만 수정)
       --o       : 눌렸을 때 내려가는 깊이 */
    .press-wrap {
      --w: 92px;
      --h: 92px;
      --o: 9px;
      position: fixed;
      top: 50%;                                  /* 세로: 화면 중앙 */
      margin-top: calc((var(--h) + var(--o)) / -2);
      margin-left: calc(var(--w) / -2);          /* 가로: 아래 JS가 메뉴 중앙에 맞춰 줘요 */
      right: 12rem;                              /* JS가 안 돌 때의 임시 위치 */
      z-index: 20;
    }
    .press {
      position: relative;
      display: block;
      width: var(--w);
      height: calc(var(--h) + var(--o));
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }
    .press-base,
    .press-face {
      position: absolute;
      left: 0;
      width: var(--w);
      height: var(--h);
      border-radius: 50%;
      box-sizing: border-box;
    }
    .press-base {
      top: var(--o);
      background: var(--text);
    }
    .press-face {
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--text);
      transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .press:hover .press-face { transform: translateY(calc(var(--o) * 0.5)); }   /* 커서를 올리면 반쯤 눌림 */
    .press:active .press-face { transform: translateY(var(--o)); }               /* 누르면 완전히 눌림 */
    .press:focus-visible { outline: 2px solid var(--text); outline-offset: 6px; border-radius: 50%; }
    /* 출력 직후 잠깐 눌린 채로 잠겨 있음 (연타 방지) */
    .press:disabled { cursor: default; }
    .press:disabled .press-face { transform: translateY(var(--o)); }

    @media (max-width: 860px) {
      .write-main { padding: 0 1.5rem 3rem; }
      .write-text { width: 100%; max-width: 100%; }
      .press-wrap {
        position: static;
        margin: 0 0 1.5rem;
      }
    }

    /* ===== 영수증 출력용 (화면에서는 숨김) ===== */
    #receipt { display: none; }

    @media print {
      @page { margin: 0; }

      /* 영수증 외의 모든 것을 인쇄에서 제외 */
      body.page-write > *:not(#receipt) { display: none !important; }
      body.page-write {
        display: block;
        min-height: 0;
        background: #fff;
      }

      #receipt {
        display: block;
        width: 72mm;                    /* 프린터 실제 인쇄 폭 (SRP-E300 기준 72mm) */
        padding: 5mm 4mm 16mm;          /* 아래 여백: 글이 커터에 안 잘리게 */
        box-sizing: border-box;
        color: #000;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        font-size: 11pt;
        line-height: 1.7;
        white-space: pre-line;
        word-break: keep-all;
      }
      #receipt .receipt-time {
        margin-top: 4mm;
        font-size: 8pt;
      }
    }
  </style>
</head>
<body class="page-archive page-write">

      <a href="index.html" class="site-name">주현완</a>

      <a href="index.html" class="nav-link">About</a>

      <a href="write.html" class="nav-link active">Write</a>

      <a href="mailto:krhwyy@gmail.com" class="nav-link">Contact</a>

  <main class="write-main">

      <button type="button" class="press" id="printBtn" aria-label="출력 (PRESS)">

    <div class="write-text">여기에 글을 붙여넣으세요.
줄바꿈은 입력한 그대로 보여요.

문단 사이는 한 줄 비우면 돼요.

글이 길어지면 이 아래로 계속 이어서 쓰면 됩니다.</div>

  <script>
  (function () {
    /* ✏️ 영수증에 랜덤으로 찍힐 문장들 — 아래 목록을 원하는 문장으로 바꾸세요.
       문장 하나 = 따옴표 하나. 줄바꿈이 필요하면 \n 을 쓰세요. */
    var SENTENCES = [
      '첫 번째 문장을 여기에 적으세요.',
      '두 번째 문장을 여기에 적으세요.\n줄바꿈은 이렇게 해요.',
      '세 번째 문장을 여기에 적으세요.',
      '네 번째 문장을 여기에 적으세요.',
      '다섯 번째 문장을 여기에 적으세요.'
    ];

    var SHOW_TIME   = false;   // true 로 바꾸면 영수증 아래에 날짜·시간이 같이 찍혀요
    var COOLDOWN_MS = 4000;    // 연타 방지: 한 번 누르면 이 시간 동안 버튼이 잠겨요

    var btn         = document.getElementById('printBtn');
    var wrap        = document.getElementById('pressWrap');
    var nav         = document.querySelector('.header-nav');
    var receiptText = document.getElementById('receiptText');
    var receiptTime = document.getElementById('receiptTime');

    /* ----- 버튼 가로 위치: 위쪽 메뉴 묶음(About ~ Instagram)의 가로 중앙 ----- */
    function placeButton() {
      if (window.innerWidth <= 860) {      // 작은 화면에서는 CSS 위치를 그대로 사용
        wrap.style.left = '';
        wrap.style.right = '';
        return;
      }
      var r = nav.getBoundingClientRect();
      wrap.style.left  = Math.round(r.left + r.width / 2) + 'px';
      wrap.style.right = 'auto';
    }
    placeButton();
    window.addEventListener('resize', placeButton);
    window.addEventListener('load', placeButton);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(placeButton);   // 글꼴이 로드된 뒤 메뉴 폭이 바뀌면 다시 계산
    }

    /* ----- 랜덤 문장: 모두 한 번씩 쓴 뒤에 다시 섞어요 (같은 문장이 연달아 안 나오게) ----- */
    var bag = [];
    var last = -1;

    function refill() {
      bag = [];
      for (var i = 0; i < SENTENCES.length; i++) bag.push(i);
      for (var j = bag.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var t = bag[j]; bag[j] = bag[k]; bag[k] = t;
      }
      if (bag.length > 1 && bag[bag.length - 1] === last) {
        var swap = Math.floor(Math.random() * (bag.length - 1));
        var tmp = bag[bag.length - 1];
        bag[bag.length - 1] = bag[swap];
        bag[swap] = tmp;
      }
    }

    function pickSentence() {
      if (bag.length === 0) refill();
      last = bag.pop();
      return SENTENCES[last];
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    btn.addEventListener('click', function () {
      if (!SENTENCES.length) return;

      receiptText.textContent = pickSentence();

      if (SHOW_TIME) {
        var d = new Date();
        receiptTime.textContent =
          d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) +
          ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      } else {
        receiptTime.textContent = '';
      }

      btn.disabled = true;
      setTimeout(function () { btn.disabled = false; }, COOLDOWN_MS);

      window.print();
    });
  })();
  </script>
